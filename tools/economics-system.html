/* ---------- 导航 ---------- */
var UNAV=[];
function buildNav(){ buildMainNav(); buildUtilityNav(); }
function buildMainNav(){
  NAV=[
    {id:'center',  t:'总控台', ic:'M4 13h7V4H4v9zm0 7h7v-5H4v5zm9 0h7V11h-7v9zm0-16v5h7V4h-7z'},
    {id:'todos',   t:'我的待办', ic:'M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11'},
    {id:'newproj', t:'新建项目', ic:'M12 5v14M5 12h14'}
  ];
}
function buildUtilityNav(){
  UNAV=[
    {id:'tool', t:'自测算小工具', ic:'M14 7l3 3M5 19l9-9M14 7l3-3 3 3-3 3M5 19v-3h3'},
    {id:'mbal', t:'物料平衡工具', ic:'M12 3v18M5 21h14M7 3h10M6 7l-3 5a3 3 0 006 0l-3-5zM18 7l-3 5a3 3 0 006 0l-3-5z'},
    {id:'base', t:'基础数据与权限', ic:'M12 1l3 5 6 1-4 4 1 6-6-3-6 3 1-6-4-4 6-1z'}
  ];
  if(CUR.role==='strat')UNAV.push({id:'debug',t:'后台模型校验',ic:'M12 2a10 10 0 100 20 10 10 0 000-20zM12 8v4l3 2'});
}
function naviHTML(n){return '<button class="navi'+(CUR.view===n.id?' on':'')+'" data-v="'+n.id+'"><span class="ix"><svg viewBox="0 0 24 24"><path d="'+n.ic+'"/></svg></span>'+n.t+'</button>';}
function paintNav(){
  var nav=document.getElementById('nav');
  if(nav){nav.innerHTML=NAV.map(naviHTML).join('');wireNavi(nav);}
  var un=document.getElementById('unav');
  if(un){un.innerHTML=(UNAV||[]).map(naviHTML).join('');wireNavi(un);}
}
function wireNavi(box){Array.prototype.forEach.call(box.querySelectorAll('.navi'),function(b){b.onclick=function(){go(b.getAttribute('data-v'));};});}
function go(v){
  if(v==='tool'){closeMbal();enterTool();return;}
  if(v==='mbal'){enterMbal();return;}
  CUR.view=v; paintNav(); render(); window.scrollTo(0,0);
}

/* ---------- 主路由 ---------- */
function render(){
  var c=document.getElementById('content');if(!c)return;
  closeMbal();
  var map={workbench:'center',archive:'center',overview:'result',board:'result',econ:'result',flow:'approval',audit:'approval',detail:'result',
    summary:'debug',model:'debug',unit:'debug',sens:'debug'};
  var v=map[CUR.view]||CUR.view; if(v!==CUR.view)CUR.view=v;
  // 顶部关键指标条：仅项目级页面显示，其余（总控台/我的待办/新建项目/基础数据）清空
  var kb=document.getElementById('kbar');
  if(kb){ var projViews={input:1,result:1,approval:1,tool:1,debug:1};
    if(projViews[v]&&(curProject()||isTool())){if(typeof paintKbar==='function')paintKbar();} else kb.innerHTML=''; }
  if(v==='center'){c.innerHTML=viewProjectCenter();wireProjectCenter(c);return;}
  if(v==='todos'){c.innerHTML=viewMyTodos();wireList(c);return;}
  if(v==='newproj'){c.innerHTML=viewNewProject();wireNewProject(c);return;}
  if(v==='tool'){c.innerHTML=viewQuickTool();wireQuick(c);return;}
  if(v==='base'){c.innerHTML=viewBaseData();wireBase();return;}
  if(v==='debug'){c.innerHTML=viewDebug();wireDebug(c);return;}
  // 项目详情子页（带项目内页签）
  if(v==='input'){if(!curProject()){c.innerHTML=needProject('协同输入');return;}c.innerHTML=projTabBar('input')+viewCollaborativeInput();wireCollabInput(c);wireProjTabs(c);return;}
  if(v==='result'){if(!curProject()){c.innerHTML=needProject('结果展示');return;}c.innerHTML=projTabBar('result')+viewResultDisplay();wireResultDisplay(c);wireProjTabs(c);return;}
  if(v==='approval'){if(!curProject()){c.innerHTML=needProject('审批状态');return;}c.innerHTML=projTabBar('approval')+viewApprovalPublish();wireApproval(c);wireProjTabs(c);return;}
  c.innerHTML=viewProjectCenter();wireProjectCenter(c);
}
/* 项目内页签：协同输入 / 结果展示 / 审批状态（+ 返回 + 保存/提交） */
function projTabBar(active){
  var p=curProject();if(!p)return '';
  var tabs=[['input','协同输入'],['result','结果展示'],['approval','审批状态']];
  var editable=(CUR.role==='strat'||p.stage==='draft'||p.stage==='filling');
  var save=editable?'<button class="btn" data-detop="save">保存</button><button class="btn pri" data-detop="submit">提交</button>':'';
  return '<div class="projbar"><button class="pbback" data-detop="back">‹ 返回总控台</button>'
    +'<div class="pbname">'+p.name+'<span class="stbadge st-'+(p.stage==='published'?'published':p.stage)+'">'+stageLabel(p.stage)+'</span>'
    +'<span class="pbtype">'+(p.ptype||'工业化项目')+' · V'+(p.version||1)+'</span></div>'
    +'<div class="pbtabs">'+tabs.map(function(t){return '<button class="pbtab'+(active===t[0]?' on':'')+'" data-pbtab="'+t[0]+'">'+t[1]+'</button>';}).join('')+'</div>'
    +'<div class="pbops">'+save+'</div></div>';
}
function wireProjTabs(c){
  Array.prototype.forEach.call(c.querySelectorAll('[data-pbtab]'),function(b){b.addEventListener('click',function(){go(b.getAttribute('data-pbtab'));});});
  Array.prototype.forEach.call(c.querySelectorAll('[data-detop]'),function(b){b.addEventListener('click',function(){
    var op=b.getAttribute('data-detop'),p=curProject();
    if(op==='back'){go('center');return;}
    if(op==='save'){saveProjects();alert('已保存。项目已进入项目列表与我的待办。');go('center');return;}
    if(op==='submit'){
      if(!p)return;
      if(p.stage==='draft'){flowAction('toFilling');}
      else{p.parts=p.parts||{};p.parts[CUR.role]=true;audit('提交本部门数据',ownerLabel(CUR.role));saveProjects();}
      alert('已提交。可在「审批状态」中查看审批进度。');go('center');return;
    }
  });});
}

/* ============================================================
   1) 项目中心（工作台 + 档案库 合并 → 项目总控台）
   ============================================================ */
function currentOwnerDept(p){
  if(p.stage==='draft')return '项目组';
  if(p.stage==='filling'){var pend=['sales','proc','pm','fin'].filter(function(k){return !(p.parts&&p.parts[k]);});return pend.length?pend.map(ownerLabel).join('/'):'项目组';}
  if(p.stage==='presubmit')return '项目组 / 战略';
  if(p.stage==='review'){var r=[];if(p.reviews.fin!=='approve')r.push('财务');if(p.reviews.strat!=='approve')r.push('战略');return r.join(' / ')||'战略';}
  return '—';
}
function pcFilter(){return CUR.pcFilter||(CUR.pcFilter={stage:'',type:'',dept:'',risk:'',special:''});}
function todoForRole(p,role){
  if(!p||p.stage==='published')return false;
  if(role==='strat')return (p.stage==='review'&&(!p.reviews||p.reviews.strat!=='approve'));
  if(role==='fin'){if(p.stage==='review'&&(!p.reviews||p.reviews.fin!=='approve'))return true;}
  if(['pm','sales','proc','fin'].indexOf(role)>=0){if((p.stage==='draft'||p.stage==='filling')&&!(p.parts&&p.parts[role]))return true;}
  if(role==='pm'&&p.stage==='presubmit')return true;
  return false;
}
function viewMyTodos(){
  var role=CUR.role;
  var rows=Object.keys(PROJECTS).filter(function(k){return k!=='__tool';}).map(function(k){return PROJECTS[k];})
    .filter(function(p){return todoForRole(p,role);}).sort(function(a,b){return b.updated-a.updated;});
  var H='<div class="head"><div class="eyebrow">我的待办</div><h1>我的待办</h1>'
    +'<p class="lead">'+ROLES[role].name+'：以下是当前等待你处理的项目（填报 / 确认 / 审批）。</p></div>';
  function actLabel(p){
    if((p.stage==='draft'||p.stage==='filling')&&['pm','sales','proc','fin'].indexOf(role)>=0&&!(p.parts&&p.parts[role]))return '待填报 / 确认本部门输入';
    if(p.stage==='review'&&role==='fin')return '待财务审批';
    if(p.stage==='review'&&role==='strat')return '待战略审批';
    if(p.stage==='presubmit'&&role==='pm')return '待提交联合审批';
    return '待处理';
  }
  var body=rows.map(function(p){var r=projIndicatorsFull(p);
    return '<tr class="clk" data-open="'+p.id+'"><td><b>'+p.name+'</b><br><span style="color:var(--muted);font-size:11px">'+p.id+'</span></td>'
      +'<td>'+(p.ptype||'工业化项目')+'</td>'
      +'<td><span class="stbadge st-'+(p.stage==='published'?'published':p.stage)+'">'+stageLabel(p.stage)+'</span></td>'
      +'<td style="color:var(--warn);font-weight:600">'+actLabel(p)+'</td>'
      +'<td class="mono">'+(r?pc(r.irrPost*100):'—')+'</td>'
      +'<td style="color:var(--muted);font-size:11px">'+fmtTime(p.updated).slice(5)+'</td>'
      +'<td><span class="go" data-open="'+p.id+'">处理 ›</span></td></tr>';
  }).join('');
  H+='<div class="sec"><div class="sec-h"><div class="t">待办项目</div><div class="d">'+rows.length+' 项</div></div>'
    +'<div class="scrollx pad" style="padding-top:6px"><table class="wbtbl"><thead><tr><th>项目名称</th><th>类型</th><th>阶段</th><th>待办事项</th><th>税后IRR</th><th>更新</th><th></th></tr></thead><tbody>'
    +(body||'<tr><td colspan="7" style="color:var(--muted)">当前没有待你处理的事项。</td></tr>')+'</tbody></table></div></div>';
  return H;
}
function viewNewProject(){
  var H='<div class="head"><div class="eyebrow">新建项目</div><h1>新建项目</h1>'
    +'<p class="lead">填写项目名称与类型后创建，进入项目详情进行协同输入、查看结果与提交审批。</p></div>';
  H+='<div class="sec"><div class="sec-h"><div class="t">项目信息</div></div><div class="pad">'
    +'<div class="fgrid" style="grid-template-columns:1fr 1fr">'
    +'<div class="field"><div class="lab"><span class="dot-w"></span>项目名称</div><div class="ibox"><input class="inp" id="npName" value="新建固定资产项目"></div></div>'
    +'<div class="field"><div class="lab"><span class="dot-w"></span>项目类型</div><div class="ibox"><select class="inp" id="npType"><option>工业化项目</option><option>扩能类技改项目</option><option>节能优化类技改项目</option></select></div></div>'
    +'</div>'
    +'<div style="margin-top:16px"><button class="btn pri" id="npCreate">创建并进入项目</button></div>'
    +'<div class="tip" style="color:var(--muted);margin-top:10px">创建后默认套用财务 / 战略定期维护的默认口径；进入详情后可在「协同输入」填报，并用「保存 / 提交」推进流程。</div>'
    +'</div></div>';
  return H;
}
function wireNewProject(c){
  var b=c.querySelector('#npCreate');
  if(b)b.addEventListener('click',function(){
    var nm=((c.querySelector('#npName')||{}).value||'新建固定资产项目').trim();
    var tp=(c.querySelector('#npType')||{}).value||'工业化项目';
    var id=makeProject(nm,blankProjectData(),'draft');
    PROJECTS[id].ptype=tp; saveProjects();
    openProject(id,false,'input');
  });
}
function viewProjectCenter(){
  var f=pcFilter();
  var ids=Object.keys(PROJECTS).filter(function(k){return k!=='__tool';});
  var rows=ids.map(function(id){var p=PROJECTS[id];var r=projIndicatorsFull(p);
    var v=r?econConclusion(r,p.data):{lvl:'need',tt:'待补充'};
    var done=['pm','sales','proc','fin'].filter(function(k){return p.parts&&p.parts[k];}).length;
    return {id:id,p:p,r:r,v:v,done:done};
  }).sort(function(a,b){return b.p.updated-a.p.updated;});
  var stat={pending:0,inputs:0,approving:0,published:0,risk:0};
  rows.forEach(function(x){var p=x.p;
    if(p.stage!=='published')stat.pending++;
    if(p.stage==='filling'&&!['pm','sales','proc','fin'].every(function(k){return p.parts[k];}))stat.inputs++;
    if(p.stage==='review'||p.stage==='presubmit')stat.approving++;
    if(p.stage==='published')stat.published++;
    if(x.v.lvl==='low')stat.risk++;
  });
  // 过滤
  var fr=rows.filter(function(x){
    var sp=f.special;
    if(sp==='pending'&&x.p.stage==='published')return false;
    if(sp==='inputs'&&!(x.p.stage==='filling'&&!['pm','sales','proc','fin'].every(function(k){return x.p.parts&&x.p.parts[k];})))return false;
    if(sp==='approving'&&!(x.p.stage==='review'||x.p.stage==='presubmit'))return false;
    if(sp==='published'&&x.p.stage!=='published')return false;
    if(sp==='risk'&&x.v.lvl!=='low')return false;
    if(f.stage&&x.p.stage!==f.stage)return false;
    if(f.type&&projPhase(x.p)!==f.type)return false;
    if(f.risk&&x.v.lvl!==f.risk)return false;
    if(f.dept&&currentOwnerDept(x.p).indexOf(f.dept)<0)return false;
    return true;
  });
  var todos=workbenchTodos(rows);
  var H='<div class="head"><div class="eyebrow">工作区</div><h1>总控台</h1>'
    +'<p class="lead">你好，'+ROLES[CUR.role].name+'。项目总览看板与项目列表统一在此；点击项目进入详情（协同输入 / 结果展示 / 审批状态）。</p></div>';
  // 顶部统计
  H+='<div class="wbtiles">'
    +tileC('待处理项目',stat.pending,'未发布','','pending')
    +tileC('待补充输入',stat.inputs,'部门未确认','warn','inputs')
    +tileC('审批中',stat.approving,'预审 + 联合审批','','approving')
    +tileC('已发布 / 已归档',stat.published,'可上会 / 复用','ok','published')
    +tileC('高风险项目',stat.risk,'经济性不足','alert','risk')
    +'</div>';
  // 我的待办
  H+='<details class="fold" open><summary>我的待办<span class="sub">'+ROLES[CUR.role].short+'</span><span class="chev">▸</span></summary><div class="foldbody">'
    +(todos.length?'<div class="nexts">'+todos.map(function(t){return '<div class="nextrow"><div class="ni">»</div><div>'+t.text+'</div><span class="go" data-open="'+t.id+'">查看 ›</span></div>';}).join('')+'</div>':'<div class="tip" style="color:var(--muted)">当前没有待你处理的事项。</div>')
    +'</div></details>';
  // 操作 + 筛选
  H+='<div class="hub-tools" style="margin-bottom:8px"><button class="btn pri" data-gonew="1">＋ 新建项目</button>'
    +'<button class="btn" data-tool="1">自测算小工具</button></div>';
  H+='<div class="filterbar"><span style="font-size:11.5px;color:var(--muted)">筛选</span>'
    +selFilter('stage',f.stage,[['','全部阶段'],['draft','立项/草稿'],['filling','数据填报'],['presubmit','预审'],['review','联合审批'],['published','已发布']])
    +selFilter('type',f.type,[['','全部口径'],['可研阶段','可研阶段'],['初设阶段','初设阶段'],['后评价阶段','后评价阶段']])
    +selFilter('dept',f.dept,[['','全部责任部门'],['销售','销售'],['采购','采购'],['项目组','项目组'],['财务','财务'],['战略','战略']])
    +selFilter('risk',f.risk,[['','全部风险'],['good','可行'],['near','边界可行'],['low','经济性不足']])
    +'</div>';
  // 项目列表
  // 分组：项目名称 → 项目阶段 → 测算版本
  var lifeOrder=['预立项','竞争力分析','正式立项','建设期','运行期','后评价'];
  function lifeOf(p){return (p.data&&p.data.device&&p.data.device.lifecycle)||'预立项';}
  function cvOf(p){return (p.data&&p.data.device&&p.data.device.calcVersion)||('V'+(p.version||1));}
  var gmap={}; fr.forEach(function(x){(gmap[x.p.name]=gmap[x.p.name]||[]).push(x);});
  var gkeys=Object.keys(gmap).sort(function(a,b){
    var la=Math.max.apply(null,gmap[a].map(function(x){return x.p.updated;}));
    var lb=Math.max.apply(null,gmap[b].map(function(x){return x.p.updated;}));return lb-la;});
  var body=gkeys.map(function(nm){
    var recs=gmap[nm].slice().sort(function(a,b){return b.p.updated-a.p.updated;});
    var x=recs[0], p=x.p, gid='g'+nm.replace(/[^a-zA-Z0-9]/g,'')+(p.id||'');
    var byLife={}; recs.forEach(function(rx){(byLife[lifeOf(rx.p)]=byLife[lifeOf(rx.p)]||[]).push(rx);});
    var stageCnt=Object.keys(byLife).length;
    var tree=lifeOrder.filter(function(lf){return byLife[lf];}).map(function(lf){
      var vers=byLife[lf].slice().sort(function(a,b){return (b.p.version||1)-(a.p.version||1);}).map(function(rx){var rp=rx.p;
        return '<div class="vrow" data-open="'+rp.id+'"><span class="vv">'+cvOf(rp)+'</span>'
          +'<span class="stbadge st-'+(rp.stage==='published'?'published':rp.stage)+'">'+stageLabel(rp.stage)+'</span>'
          +'<span class="vir">税后IRR '+(rx.r?pc(rx.r.irrPost*100):'—')+'</span>'
          +'<span class="vir" style="color:var(--muted)">'+fmtTime(rp.updated).slice(5)+'</span>'
          +'<span class="go">进入版本 ›</span>'
          +'<button class="delbtn" data-delver="'+rp.id+'" title="删除此测算版本">✕</button></div>';}).join('');
      return '<div class="ltree"><div class="lname">项目阶段 · '+lf+'</div>'+vers+'</div>';}).join('');
    var row='<tr class="clk" data-open="'+p.id+'"><td><div style="display:flex;align-items:center;gap:7px"><b>'+nm+'</b>'
      +'<button class="treetog" data-treetog="'+gid+'" title="展开各阶段 / 测算版本">▾</button>'
      +'<button class="delbtn" data-delgrp="'+p.id+'" title="删除整个项目（含全部阶段/版本）">✕</button></div>'
      +'<span style="color:var(--muted);font-size:11px">'+stageCnt+' 个阶段 · '+recs.length+' 个版本</span></td>'
      +'<td>'+(p.ptype||'工业化项目')+'</td>'
      +'<td><span class="lifebadge">'+lifeOf(p)+'</span></td>'
      +'<td class="mono">'+cvOf(p)+'</td>'
      +'<td><span class="stbadge st-'+(p.stage==='published'?'published':p.stage)+'">'+stageLabel(p.stage)+'</span></td>'
      +'<td class="mono">'+(x.r?pc(x.r.irrPost*100):'—')+'</td>'
      +'<td>'+verdictMini2(x.v.lvl)+'</td>'
      +'<td style="color:var(--muted);font-size:11px">'+fmtTime(p.updated).slice(5)+'</td></tr>';
    var sub='<tr class="vtree-row" id="vtree-'+gid+'" style="display:none"><td colspan="8" style="background:var(--soft);padding:8px 14px">'+tree+'</td></tr>';
    return row+sub;
  }).join('');
  var spLbl={pending:'待处理项目',inputs:'待补充输入',approving:'审批中',published:'已发布 / 已归档',risk:'高风险项目'}[f.special];
  if(spLbl)H+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px"><span style="color:var(--muted)">当前筛选：</span><span class="lifebadge">'+spLbl+'</span><button class="btn" data-clearsp="1" style="padding:4px 10px">清除筛选</button></div>';
  H+='<div class="sec"><div class="sec-h"><div class="t">项目列表</div><div class="d">'+gkeys.length+' 个项目 · '+fr.length+' 个测算版本</div></div>'
    +'<div class="scrollx pad" style="padding-top:6px"><table class="wbtbl"><thead><tr><th>项目名称</th><th>项目类型</th><th>项目阶段</th><th>测算版本</th><th>审批状态</th><th>税后IRR</th><th>结论</th><th>更新</th></tr></thead><tbody>'
    +(body||'<tr><td colspan="8" style="color:var(--muted)">无匹配项目</td></tr>')+'</tbody></table></div></div>';
  return H;
}
function tileC(label,val,sub,cls,tile){return '<div class="wbtile '+cls+(tile?' clk':'')+'"'+(tile?' data-tile="'+tile+'"':'')+'><div class="wl">'+label+'</div><div class="wv">'+val+'</div><div class="ws">'+sub+'</div></div>';}
function selFilter(key,val,opts){return '<select data-pcf="'+key+'">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(val===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>';}
function wireProjectCenter(c){
  wireList(c);
  Array.prototype.forEach.call(c.querySelectorAll('select[data-pcf]'),function(s){s.addEventListener('change',function(){var f=pcFilter();f.special='';f[s.getAttribute('data-pcf')]=s.value;render();});});

function boardSteps(p){
  var steps=['输入条件准备','部门确认','战略复核','财务审核','联合审批','发布归档'];
  var allParts=['pm','sales','proc','fin'].every(function(k){return p.parts&&p.parts[k];});
  var done=[false,false,false,false,false,false];
  if(p.stage!=='draft')done[0]=true;
  if(['presubmit','review','published'].indexOf(p.stage)>=0||allParts)done[1]=true;
  if(['review','published'].indexOf(p.stage)>=0)done[2]=true;
  if(p.reviews&&p.reviews.fin==='approve')done[3]=true;
  if(p.reviews&&p.reviews.fin==='approve'&&p.reviews.strat==='approve')done[4]=true;
  if(p.stage==='published')done[5]=true;
  var cur=-1;for(var i=0;i<6;i++){if(!done[i]){cur=i;break;}}
  return {steps:steps,done:done,cur:cur};
}
function stepbarHTML(p){var s=boardSteps(p);
  return '<div class="stepbar">'+s.steps.map(function(t,i){
    var cls=s.done[i]?'done':(i===s.cur?'cur':'');
    return '<div class="step '+cls+'"><div class="dot"></div><div class="sl">'+t+'</div></div>';}).join('')+'</div>';
}

}
