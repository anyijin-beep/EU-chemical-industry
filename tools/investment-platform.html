<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>固定资产项目管理平台 · 万华化学</title>
<style>
  :root{
    --ink:#2B314A; --ink2:#404a5c; --paper:#eef1f5; --card:#ffffff;
    --line:#cdd5df; --line2:#e6eaf0; --soft:#f4f6f9;
    --blue:#00489D; --sky:#0092E1; --ok:#2CCC74; --ok-bg:#e8f7ef;
    --warn:#FF9429; --warn-bg:#fff3e6; --bad:#EA5514; --bad-bg:#fdeee7; --muted:#8497B0;
    --side:#222a40;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .mono{font-family:"SF Mono",ui-monospace,Menlo,Consolas,"Roboto Mono",monospace;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}
  ::selection{background:rgba(0,146,225,.22)}

  .wrap{display:flex;min-height:100vh}

  /* ---------- sidebar ---------- */
  .side{position:sticky;top:0;align-self:flex-start;height:100vh;width:236px;flex:0 0 auto;
    background:var(--side);color:#c3cad6;display:flex;flex-direction:column;padding:18px 14px}
  .brand{display:flex;align-items:center;gap:11px;padding:6px 6px 20px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08)}
  .brand .glyph{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,#0092E1,#00489D);
    display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px;letter-spacing:.02em;flex:0 0 auto}
  .brand b{font-size:14.5px;color:#fff;display:block;line-height:1.2;font-weight:680}
  .brand small{font-size:10px;color:#8497B0;letter-spacing:.05em}
  .navlab{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#71809a;margin:14px 8px 7px}
  .navi{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;border-radius:9px;
    padding:10px 11px;font-size:13.5px;font-weight:550;color:#c3cad6;text-align:left;margin-bottom:2px;transition:.13s;position:relative}
  .navi:hover{background:rgba(255,255,255,.06);color:#fff}
  .navi.on{background:linear-gradient(90deg,rgba(0,146,225,.30),rgba(0,146,225,.10));color:#fff}
  .navi.on::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--sky)}
  .navi .ix{width:20px;height:20px;flex:0 0 auto;display:grid;place-items:center;opacity:.9}
  .navi .ix svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .navi .badge{margin-left:auto;font-size:10.5px;font-weight:700;background:rgba(0,146,225,.25);color:#cfeafe;border-radius:20px;padding:1px 8px;min-width:20px;text-align:center}
  .side .foot{margin-top:auto;padding:12px 8px 4px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#71809a;line-height:1.5}
  .side .foot b{color:#aeb8c9;font-weight:600}

  /* ---------- main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(238,241,245,.9);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:0 26px;height:58px;display:flex;align-items:center;gap:18px}
  .crumb{font-size:13px;color:var(--muted)}
  .crumb b{color:var(--ink);font-weight:650}
  .search{margin-left:auto;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;width:260px;transition:.13s}
  .search:focus-within{border-color:var(--sky);box-shadow:0 0 0 3px rgba(0,146,225,.12)}
  .search svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:0 0 auto}
  .search input{border:0;outline:none;width:100%;font-size:13px;background:transparent}
  .who{display:flex;align-items:center;gap:9px}
  .who .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#0092E1,#00489D);color:#fff;
    display:grid;place-items:center;font-size:12.5px;font-weight:700}
  .who .nm{font-size:12.5px;line-height:1.2}.who .nm small{display:block;color:var(--muted);font-size:10.5px}

  .content{padding:24px 26px 56px;width:100%;max-width:1280px}
  @media(max-width:980px){.side{width:64px}.brand b,.brand small,.navlab,.navi span:not(.ix),.navi .badge,.side .foot{display:none}
    .navi{justify-content:center;padding:11px 0}.brand{justify-content:center}.search{width:150px}}

  /* ---------- headings ---------- */
  .phead{margin-bottom:20px}
  .eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue);font-weight:700}
  h1{font-size:24px;margin:4px 0 0;font-weight:720;letter-spacing:-.01em}
  .lead{font-size:13px;color:var(--ink2);margin-top:6px;max-width:760px}

  /* ---------- lifecycle pipeline (signature) ---------- */
  .pipe{background:linear-gradient(120deg,#1d2740,#27314e);border-radius:14px;padding:22px 26px 20px;
    color:#dfe5ef;position:relative;overflow:hidden;margin-bottom:22px;box-shadow:0 10px 30px -16px rgba(15,30,60,.5)}
  .pipe::after{content:"";position:absolute;inset:0;background:radial-gradient(900px 200px at 12% -40%,rgba(0,146,225,.25),transparent)}
  .pipe-h{display:flex;align-items:baseline;gap:12px;position:relative;z-index:1;margin-bottom:18px}
  .pipe-h .t{font-size:14px;font-weight:680;color:#fff}
  .pipe-h .s{font-size:11.5px;color:#8ea0bf}
  .pipe-h .tot{margin-left:auto;text-align:right}
  .pipe-h .tot .n{font-size:22px;font-weight:760;color:#fff}
  .pipe-h .tot .l{font-size:10.5px;color:#8ea0bf;letter-spacing:.04em}
  .flow{display:flex;align-items:stretch;position:relative;z-index:1}
  .stg{flex:1;text-align:center;position:relative;padding:0 4px}
  .stg .dot{width:15px;height:15px;border-radius:50%;margin:0 auto 12px;position:relative;z-index:2;
    border:3px solid #202a44;box-shadow:0 0 0 2px currentColor}
  .stg .n{font-size:27px;font-weight:780;line-height:1;font-variant-numeric:tabular-nums}
  .stg .nm{font-size:12px;color:#aeb8c9;margin-top:5px;font-weight:560}
  .stg .sub{font-size:10.5px;color:#7c8aa6;margin-top:2px}
  .flow .track{position:absolute;top:6px;left:0;right:0;height:3px;z-index:1;
    background:linear-gradient(90deg,#2CCC74,#0092E1,#FF9429,#EA5514,#8497B0);opacity:.55;border-radius:3px;
    background-size:300% 100%;animation:flow 6s linear infinite}
  @keyframes flow{0%{background-position:0% 0}100%{background-position:300% 0}}
  @media(prefers-reduced-motion:reduce){.flow .track{animation:none}}

  /* ---------- stat tiles ---------- */
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px;position:relative;overflow:hidden}
  .tile .cap{font-size:11px;color:var(--muted);letter-spacing:.03em;display:flex;align-items:center;gap:6px}
  .tile .cap .sw{width:8px;height:8px;border-radius:2px}
  .tile .big{font-size:27px;font-weight:740;margin-top:6px;letter-spacing:-.01em}
  .tile .big small{font-size:13px;color:var(--muted);font-weight:600;margin-left:3px}
  .tile .delta{font-size:11.5px;margin-top:3px;color:var(--ink2)}
  .tile .delta b{font-weight:700}
  .up{color:var(--ok)}.down{color:var(--bad)}

  /* ---------- cards ---------- */
  .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
  @media(max-width:980px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:18px;overflow:hidden}
  .card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line2)}
  .card-h .t{font-size:14px;font-weight:660}
  .card-h .d{font-size:11.5px;color:var(--muted)}
  .card-h .more{margin-left:auto;font-size:11.5px;color:var(--blue);background:none;border:0;font-weight:600}
  .card-h .more:hover{text-decoration:underline}
  .pad{padding:16px 18px}

  /* ---------- project rows ---------- */
  .prow{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line2);transition:.1s}
  .prow:last-child{border-bottom:0}
  .prow:hover{background:var(--soft)}
  .prow .pn{font-weight:600;font-size:13.5px}
  .prow .pm{font-size:11.5px;color:var(--muted);margin-top:1px}
  .prow .rt{margin-left:auto;text-align:right;flex:0 0 auto}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;border-radius:20px;padding:2px 10px;white-space:nowrap}
  .c-blue{background:#e7f0fb;color:#00489D}.c-sky{background:#e3f4fd;color:#0079bd}
  .c-ok{background:var(--ok-bg);color:#1c8a4e}.c-warn{background:var(--warn-bg);color:#c96a00}
  .c-bad{background:var(--bad-bg);color:#b73f0c}.c-mut{background:#eef1f5;color:#5b6b85}

  /* progress bar */
  .pbar{height:7px;border-radius:6px;background:#e7ebf1;overflow:hidden;width:120px}
  .pbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#0092E1,#00489D)}
  .pbar.warn i{background:linear-gradient(90deg,#FFb454,#FF9429)}
  .pct{font-size:12px;font-weight:700;margin-left:9px;vertical-align:middle}

  /* stepper for 立项 workflow */
  .steps{display:flex;align-items:center;gap:0;font-size:10.5px}
  .steps .sp{display:flex;align-items:center;color:var(--muted)}
  .steps .sp .bub{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;
    font-size:9px;font-weight:700;background:#fff;color:var(--muted)}
  .steps .sp.done .bub{background:var(--ok);border-color:var(--ok);color:#fff}
  .steps .sp.cur .bub{background:var(--blue);border-color:var(--blue);color:#fff}
  .steps .sp .ln{width:18px;height:2px;background:var(--line)}
  .steps .sp.done .ln{background:var(--ok)}

  /* tables */
  table.t{width:100%;border-collapse:collapse;font-size:12.5px}
  table.t thead th{text-align:left;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);
    font-weight:650;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--soft)}
  table.t thead th.r{text-align:right}
  table.t td{padding:11px 14px;border-bottom:1px solid var(--line2)}
  table.t td.r{text-align:right;font-variant-numeric:tabular-nums}
  table.t tbody tr:hover{background:var(--soft)}
  table.t tbody tr:last-child td{border-bottom:0}

  /* feed / activity */
  .feed{padding:6px 0}
  .fit{display:flex;gap:11px;padding:11px 18px;border-bottom:1px solid var(--line2)}
  .fit:last-child{border-bottom:0}
  .fit .fi{width:30px;height:30px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;font-size:13px}
  .fit .fb{font-size:12.5px}.fit .fb .fm{color:var(--muted);font-size:11px;margin-top:1px}

  /* econ frame */
  .econwrap{position:fixed;inset:0 0 0 236px;background:var(--paper);display:flex;flex-direction:column;z-index:40}
  @media(max-width:980px){.econwrap{left:64px}}
  .econbar{height:48px;flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px}
  .econbar .bk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--blue);background:#eef4fb;border:1px solid #d5e4f6;border-radius:7px;padding:6px 12px}
  .econbar .ti{font-size:13px;font-weight:600}
  .econbar .ti small{color:var(--muted);font-weight:500;margin-left:8px}
  .econwrap iframe{flex:1;width:100%;border:0;background:#eef1f5}
  .loadingEcon{flex:1;display:grid;place-items:center;color:var(--muted);font-size:13px}

  /* investment estimator */
  .estgrid{display:grid;grid-template-columns:1fr 360px;gap:18px}
  @media(max-width:880px){.estgrid{grid-template-columns:1fr}}
  .estrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
  .estrow label{flex:1;font-size:13px;color:var(--ink2)}
  .estrow .ib{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;width:180px}
  .estrow .ib:focus-within{border-color:var(--sky);box-shadow:0 0 0 3px rgba(0,146,225,.1)}
  .estrow .ib input{border:0;outline:none;padding:7px 9px;width:100%;text-align:right;font-family:"SF Mono",monospace;font-variant-numeric:tabular-nums}
  .estrow .ib .u{padding:0 9px;font-size:11px;color:var(--muted);border-left:1px solid var(--line2)}
  .esttot{background:linear-gradient(135deg,#00489D,#0092E1);color:#fff;border-radius:13px;padding:20px;align-self:start;position:sticky;top:74px}
  .esttot .l{font-size:11.5px;opacity:.85;letter-spacing:.04em}
  .esttot .v{font-size:32px;font-weight:760;margin-top:4px;font-variant-numeric:tabular-nums}
  .esttot hr{border:0;border-top:1px solid rgba(255,255,255,.2);margin:14px 0}
  .esttot .kv{display:flex;justify-content:space-between;font-size:12px;margin:6px 0;opacity:.92}
  /* est tabs + audit */
  .esttabs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin-bottom:18px}
  .esttabs button{border:0;background:transparent;color:var(--ink2);font-size:13px;font-weight:600;padding:8px 16px;border-radius:7px}
  .esttabs button.on{background:var(--blue);color:#fff}
  .gnrow{margin-bottom:14px}
  .gnrow label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:560}
  .gnrow select,.gnrow .ib{width:100%}
  .gnrow select{border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:13px;background:#fff;outline:none}
  .gnrow select:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(0,146,225,.1)}
  .gnrow .ib{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .gnrow .ib:focus-within{border-color:var(--sky);box-shadow:0 0 0 3px rgba(0,146,225,.1)}
  .gnrow .ib input{border:0;outline:none;padding:9px 10px;width:100%;font-family:"SF Mono",monospace;font-variant-numeric:tabular-nums}
  .gnrow .ib .u{padding:0 10px;font-size:11px;color:var(--muted);border-left:1px solid var(--line2)}
  .gnnote{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:4px}
  .gnbtn{width:100%;background:var(--blue);color:#fff;border:0;border-radius:9px;padding:11px;font-weight:650;font-size:13.5px;margin-top:4px}
  .gnbtn:hover{background:#0092E1}
  .upbox{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;background:var(--soft);margin-bottom:14px}
  .upbox p{font-size:12px;color:var(--muted);margin:8px 0 0}
  .upbox .file{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--blue);cursor:pointer}
  .verdict{display:flex;align-items:center;gap:13px;border-radius:11px;padding:15px 17px;margin-bottom:16px;border:1px solid}
  .verdict .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:0 0 auto}
  .verdict.pass{border-color:var(--ok);background:var(--ok-bg)} .verdict.pass .ic{background:var(--ok)}
  .verdict.watch{border-color:var(--warn);background:var(--warn-bg)} .verdict.watch .ic{background:var(--warn)}
  .verdict.back{border-color:var(--bad);background:var(--bad-bg)} .verdict.back .ic{background:var(--bad)}
  .verdict .vt b{font-size:14px} .verdict .vt div{font-size:12px;color:var(--ink2);margin-top:2px}

  /* report review */
  .rev{display:flex;align-items:flex-start;gap:13px;padding:15px 18px;border-bottom:1px solid var(--line2)}
  .rev .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;font-size:15px;font-weight:700}
  .rev .body{flex:1}
  .rev .body .rh{display:flex;align-items:center;gap:9px}
  .rev .body .rh b{font-size:13.5px;font-weight:650}
  .rev ul{margin:8px 0 0;padding-left:0;list-style:none}
  .rev li{font-size:12px;color:var(--ink2);padding:3px 0 3px 20px;position:relative}
  .rev li::before{position:absolute;left:0;top:3px}
  .rev li.ok::before{content:"✓";color:var(--ok)}
  .rev li.warn::before{content:"!";color:var(--warn);font-weight:800}
  .rev li.bad::before{content:"✕";color:var(--bad);font-weight:800}

  /* knowledge base assistant */
  .kbhero{background:linear-gradient(135deg,#00489D,#0092E1);border-radius:14px;padding:22px 24px;color:#fff;margin-bottom:18px;
    box-shadow:0 10px 30px -16px rgba(15,30,60,.5)}
  .kbhero .ht{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .kbhero .ht h2{font-size:17px;font-weight:700;margin:0}
  .kbhero .ht p{font-size:12px;color:#cfe2f7;margin:2px 0 0}
  .roletog{margin-left:auto;display:inline-flex;background:rgba(255,255,255,.16);border-radius:9px;padding:3px;gap:3px}
  .roletog button{border:0;background:transparent;color:#dfeaf7;font-size:12px;font-weight:600;padding:6px 13px;border-radius:7px}
  .roletog button.on{background:#fff;color:var(--blue)}
  .kbsearch{display:flex;align-items:center;gap:8px;background:#fff;border-radius:11px;padding:5px 6px 5px 14px;margin-top:15px}
  .kbsearch svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:0 0 auto}
  .kbsearch input{flex:1;border:0;outline:none;font-size:15px;padding:10px 4px;color:var(--ink);background:transparent}
  .kbsearch button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:11px 22px;font-weight:650;font-size:14px}
  .kbcats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .kbcats button{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;color:var(--ink2);font-weight:560}
  .kbcats button:hover{border-color:var(--sky)}
  .kbcats button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .kbcats button .ct{margin-left:6px;font-weight:700;opacity:.65;font-variant-numeric:tabular-nums}
  .kbans{background:#eef4fb;border:1px solid #d5e4f6;border-left:3px solid var(--blue);border-radius:11px;padding:15px 17px;margin-bottom:16px;font-size:13px;line-height:1.7}
  .kbans .qa{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:700;margin-bottom:6px}
  .kbans b{color:var(--blue)}
  .kbcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:12px;transition:.12s;cursor:default}
  .kbcard:hover{border-color:var(--sky);box-shadow:0 6px 18px -12px rgba(15,40,90,.35)}
  .kbcard .ch{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .kbcard h4{font-size:14px;font-weight:650;margin:0}
  .kbcard .snip{font-size:12.5px;color:var(--ink2);line-height:1.65}
  .kbcard mark{background:#fff2c2;color:inherit;padding:0 2px;border-radius:2px}
  .kbsrc{font-size:11.5px;color:var(--muted);margin-top:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px dashed var(--line2);padding-top:9px}
  .kbsrc .open{margin-left:auto;color:var(--blue);font-weight:600;background:none;border:0;font-size:11.5px}
  .kbsrc .open:hover{text-decoration:underline}
  .kb-mat{background:#efeafc;color:#5b46c4}
  .kbtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:20px}
  @media(max-width:760px){.kbtiles{grid-template-columns:repeat(2,1fr)}}
  .kbtile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;cursor:pointer;transition:.12s}
  .kbtile:hover{border-color:var(--sky);box-shadow:0 6px 18px -12px rgba(15,40,90,.3)}
  .kbtile .tt{font-size:13.5px;font-weight:650;display:flex;align-items:center;gap:8px}
  .kbtile .tt .ct{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
  .kbtile .td{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}

/* ============================================================
   4) 项目投资估算 —— 智能估算生成 + 投资估算审核
   ------------------------------------------------------------
   两功能共用基准库 EST_BENCH / EST_NORM（单位投资强度 + 典型分项结构）。
   后期 IT 可将基准库替换为真实历史项目回归模型，生成/审核逻辑不变。
   ============================================================ */
var EST_BENCH={
  "聚醚多元醇":{unit:0.45,band:0.20},
  "聚碳酸酯(PC)":{unit:1.00,band:0.20},
  "锂电正极前驱体":{unit:1.00,band:0.25},
  "异氰酸酯(MDI/ADI)":{unit:1.20,band:0.20},
  "热塑性聚氨酯(TPU)":{unit:0.80,band:0.20},
  "通用化工(默认)":{unit:0.70,band:0.25}
};
var EST_NORM={build:0.80,intang:0.04,reserve:0.06,wc:0.10};      // 占总投资
var EST_BUILD={land:0.06,building:0.20,equip:0.48,install:0.15,other:0.11}; // 占建设投资
var EST_COMPLEX={"常规装置":1.00,"较复杂":1.15,"超复杂/首套":1.30};
var EST_ROWS=[
  {k:"land",l:"土地及场地平整"},{k:"building",l:"建筑工程费"},{k:"equip",l:"设备购置费"},
  {k:"install",l:"安装工程费"},{k:"other",l:"工程建设其他费用"},
  {k:"intang",l:"无形资产(技术/专利)"},{k:"reserve",l:"基本预备费"},{k:"wc",l:"铺底流动资金"}
];
var EST_TAB="gen";
var EST_VAL={land:0,building:0,equip:0,install:0,other:0,intang:0,reserve:0,wc:0};

/* —— 生成引擎：产能(万吨)+类型+复杂度 → 分项金额(万元) —— */
function estGenerate(type,capWan,complexK){
  var b=EST_BENCH[type]||EST_BENCH["通用化工(默认)"];
  var cf=EST_COMPLEX[complexK]||1;
  var total=capWan*10000*b.unit*cf;            // 万元
  var build=total*EST_NORM.build;
  return {total:total,unit:b.unit*cf,
    val:{land:build*EST_BUILD.land,building:build*EST_BUILD.building,equip:build*EST_BUILD.equip,
      install:build*EST_BUILD.install,other:build*EST_BUILD.other,
      intang:total*EST_NORM.intang,reserve:total*EST_NORM.reserve,wc:total*EST_NORM.wc}};
}
/* —— 审核引擎 —— */
function estAudit(inp){
  var b=EST_BENCH[inp.type]||EST_BENCH["通用化工(默认)"];
  var f=[],worst=0; // 0 ok,1 warn,2 bad
  var note=function(level,txt){f.push([["ok","warn","bad"][level],txt]);if(level>worst)worst=level;};
  // 单位投资对标
  if(inp.cap>0&&inp.total>0){
    var u=inp.total/(inp.cap*10000),lo=b.unit*(1-b.band),hi=b.unit*(1+b.band);
    if(u<lo)note(1,"单位投资 "+u.toFixed(3)+" 万元/吨，低于基准区间 "+lo.toFixed(2)+"–"+hi.toFixed(2)+"，可能漏项或产能口径偏大，需核实。");
    else if(u>hi)note(1,"单位投资 "+u.toFixed(3)+" 万元/吨，高于基准区间 "+lo.toFixed(2)+"–"+hi.toFixed(2)+"，投资偏高，需说明原因。");
    else note(0,"单位投资 "+u.toFixed(3)+" 万元/吨，处于「"+inp.type+"」基准区间 "+lo.toFixed(2)+"–"+hi.toFixed(2)+" 内，合理。");
  }else note(2,"缺少产能或申报总投资，无法做单位投资对标。");
  // 分项占比对标（提供才校验）
  var chk=function(name,v,norm,tol){
    if(!(v>0)||!(inp.total>0))return;
    var r=v/inp.total,dev=(r-norm)/norm;
    if(Math.abs(dev)>tol)note(1,name+"占总投资 "+(r*100).toFixed(1)+"%，偏离典型值 "+(norm*100).toFixed(0)+"% 约 "+(dev>0?"+":"")+(dev*100).toFixed(0)+"%，建议复核。");
    else note(0,name+"占比 "+(r*100).toFixed(1)+"%，与典型结构一致。");
  };
  chk("建设投资",inp.build,EST_NORM.build,0.10);
  chk("铺底流动资金",inp.wc,EST_NORM.wc,0.40);
  chk("基本预备费",inp.reserve,EST_NORM.reserve,0.50);
  // 缺项
  var miss=[];if(!(inp.build>0))miss.push("建设投资");if(!(inp.wc>0))miss.push("铺底流动资金");if(!(inp.reserve>0))miss.push("基本预备费");
  if(miss.length)note(miss.length>=2?2:1,"申报数据缺少分项："+miss.join("、")+"，建议补全后再审。");
  return {level:worst,findings:f};
}

function wireEst(){

function wireAudit(){
  var gv=function(id){return document.getElementById(id);};
  function fill(d){
    if(d.type&&EST_BENCH[d.type])gv("auType").value=d.type;
    ["cap","total","build","reserve","wc"].forEach(function(k){if(d[k]!=null&&gv("au"+k.charAt(0).toUpperCase()+k.slice(1)))gv("au"+k.charAt(0).toUpperCase()+k.slice(1)).value=d[k];});
  }
  gv("auSample").onclick=function(){fill({type:"聚碳酸酯(PC)",cap:13,total:155000,build:118000,reserve:7000,wc:9000});};
  gv("auFile").onchange=function(e){
    var file=e.target.files[0];if(!file)return;var rd=new FileReader();
    rd.onload=function(){
      var txt=rd.result,d={};
      try{d=JSON.parse(txt);}catch(_){
        txt.split(/\r?\n/).forEach(function(line){var m=line.split(/[,，=:：\t]/);if(m.length>=2){var k=m[0].trim().toLowerCase();d[k]=isNaN(+m[1])?m[1].trim():+m[1];}});
      }
      fill(d);
    };rd.readAsText(file);
  };
  gv("auRun").onclick=function(){
    var inp={type:gv("auType").value,cap:+gv("auCap").value||0,total:+gv("auTotal").value||0,
      build:+gv("auBuild").value||0,reserve:+gv("auReserve").value||0,wc:+gv("auWc").value||0};
    var r=estAudit(inp);

            ["watch","!","需关注","存在偏离项，建议补充说明或复核后再提交。"],
            ["back","✕","建议退回","存在缺项或重大偏离，需补全/修订后重报。"]][r.level];
    var items=r.findings.map(function(p){return '<li class="'+p[0]+'">'+esc(p[1])+'</li>';}).join("");
    gv("auResult").innerHTML='<div class="pad"><div class="verdict '+vm[0]+'"><div class="ic">'+vm[1]+'</div>'
      +'<div class="vt"><b>'+vm[2]+'</b><div>'+vm[3]+'</div></div></div>'
      +'<div class="rev" style="padding:0;border:0"><div class="body"><ul>'+items+'</ul></div></div></div>';

}

/* —— 检索（兼容中文无分词：正向词匹配 + 反向标签匹配 + 二元组兜底） —— */
function kbSearch(q,cat,role){
  var ql=q.toLowerCase();
  var toks=ql.split(/[\s,，、。?？!！:：;；]+/).filter(Boolean);
  var clean=ql.replace(/[\s,，、。?？!！:：;；()（）]/g,""),grams=[];
  for(var i=0;i<clean.length-1;i++)grams.push(clean.slice(i,i+2));
  var items=buildKB(),scored=[];
  items.forEach(function(it){
    var t=it.title.toLowerCase(),tg=(it.tags||[]).join(" ").toLowerCase(),b=it.body.toLowerCase(),sc=0;
    toks.forEach(function(k){if(k.length<2)return;if(t.indexOf(k)>=0)sc+=3;if(tg.indexOf(k)>=0)sc+=2;if(b.indexOf(k)>=0)sc+=1;});
    (it.tags||[]).forEach(function(tag){var tl=String(tag).toLowerCase();if(tl.length>=2&&ql.indexOf(tl)>=0)sc+=3;});
    grams.forEach(function(g){if(t.indexOf(g)>=0)sc+=0.6;else if(tg.indexOf(g)>=0)sc+=0.3;});
    if(sc>=1){
      if(role==="pm"&&(it.type==="流程"||it.type==="制度"))sc+=1.5;
      if(role==="strat"&&(it.type==="材料"||it.type==="数据"||it.type==="经济性"))sc+=1.5;
      scored.push({it:it,sc:sc});
    }
  });
  if(cat&&cat!=="all")scored=scored.filter(function(x){return x.it.type===cat;});
  scored.sort(function(a,b){return b.sc-a.sc;});
  return scored.map(function(x){return x.it;});
}
function kbBrowse(cat){return buildKB().filter(function(it){return it.type===cat;});}
function kbHighlight(text,q){
  var safe=esc(text),toks=q.toLowerCase().split(/[\s,，、。?？]+/).filter(function(k){return k.length>1;});
  toks.forEach(function(k){
    try{safe=safe.replace(new RegExp("("+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>");}catch(e){}
  });
  return safe;
}
function kbCard(it,q){
  var m=KB_TYPE[it.type];
  var snip=it.body.length>160?it.body.slice(0,158)+"…":it.body;
  var open=it.projectId?'<button class="open" data-jump="archive">查看资料 ›</button>':'';
  return '<div class="kbcard"><div class="ch"><span class="chip '+m[0]+'">'+m[1]+'</span><h4>'+esc(it.title)+'</h4></div>'
    +'<div class="snip">'+(q?kbHighlight(snip,q):esc(snip))+'</div>'
    +'<div class="kbsrc">来源：'+esc(it.src)+open+'</div></div>';
}

var KBST={q:"",cat:"all",role:"pm"};
function viewAssist(){
  return '<div class="phead"><div class="eyebrow">KNOWLEDGE BASE</div><h1>智能问答助手</h1>'
    +'<p class="lead">投资管理知识库 · 统一汇集立项流程、制度规范、投资估算、经济性分析与已立项项目材料。项目经理快速查流程与口径，战略发展部快速取项目资料。</p></div>'
    +'<div class="kbhero"><div class="ht"><div><h2>问点什么？</h2><p>支持自然语言提问与关键词检索，结果标注来源出处</p></div>'
    +'<div class="roletog" id="kbrole"><button data-role="pm">项目经理视角</button><button data-role="strat">战略发展部视角</button></div></div>'
    +'<div class="kbsearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>'
    +'<input id="kbq" placeholder="例如：立项流程有哪些节点 / 乙烯二期 项目材料"><button id="kbgo">检索</button></div></div>'
    +'<div class="kbcats" id="kbcats"></div>'
    +'<div id="kbbody"></div>';
}
function wireAssist(){
  var inp=document.getElementById("kbq");
  function paint(){
    // 分类条
    var all=buildKB();
    var cnt={};all.forEach(function(it){cnt[it.type]=(cnt[it.type]||0)+1;});cnt.all=all.length;
    document.getElementById("kbcats").innerHTML=KB_CATS.map(function(c){
      return '<button data-cat="'+c.id+'"'+(KBST.cat===c.id?' class="on"':'')+'>'+c.t+'<span class="ct">'+(cnt[c.id]||0)+'</span></button>';
    }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("#kbcats button"),function(b){
      b.onclick=function(){KBST.cat=b.getAttribute("data-cat");KBST.q="";inp.value="";paint();};});
    // 角色
    Array.prototype.forEach.call(document.querySelectorAll("#kbrole button"),function(b){
      b.className=(b.getAttribute("data-role")===KBST.role)?"on":"";
      b.onclick=function(){KBST.role=b.getAttribute("data-role");paint();};});
    // 主体
    var body=document.getElementById("kbbody"),html="";
    if(KBST.q){
      var ans=kbDirectAnswer(KBST.q);
      if(ans)html+='<div class="kbans"><div class="qa">直接回答</div>'+ans+'</div>';
      var res=kbSearch(KBST.q,KBST.cat,KBST.role);
      html+=res.length?('<div class="kbpop"><div class="lab">相关资料 · '+res.length+' 条</div></div>'+res.map(function(it){return kbCard(it,KBST.q);}).join("")) 
        :(ans?"":'<div class="empty">没有找到相关内容。试试更换关键词，或在上方切换分类浏览。</div>');
    }else if(KBST.cat!=="all"){
      var list=kbBrowse(KBST.cat);
      html+='<div class="kbpop"><div class="lab">'+KB_CATS.filter(function(c){return c.id===KBST.cat;})[0].t+' · '+list.length+' 条</div></div>'
        +list.map(function(it){return kbCard(it,"");}).join("");
    }else{
      // 落地页：分类速览 + 角色热门问题
      html+='<div class="kbtiles">'+KB_CATS.filter(function(c){return c.id!=="all";}).map(function(c){
        var n=all.filter(function(it){return it.type===c.id;}).length;var m=KB_TYPE[c.id];
        return '<div class="kbtile" data-cat="'+c.id+'"><div class="tt"><span class="chip '+m[0]+'">'+m[1]+'</span>'+c.t+'<span class="ct">'+n+'</span></div>'
          +'<div class="td">'+KB_CAT_DESC[c.id]+'</div></div>';
      }).join("")+'</div>';
      html+='<div class="kbpop"><div class="lab">热门问题 · '+(KBST.role==="pm"?"项目经理":"战略发展部")+'</div>'
        +'<div class="chips">'+KB_POP[KBST.role].map(function(q){return '<button data-q="'+esc(q)+'">'+esc(q)+'</button>';}).join("")+'</div></div>';
    }
    body.innerHTML=html;
    Array.prototype.forEach.call(body.querySelectorAll("[data-cat]"),function(b){
      b.onclick=function(){KBST.cat=b.getAttribute("data-cat");KBST.q="";inp.value="";paint();};});
    Array.prototype.forEach.call(body.querySelectorAll("[data-q]"),function(b){
      b.onclick=function(){KBST.q=b.getAttribute("data-q");inp.value=KBST.q;paint();};});
  }
  function run(){KBST.q=inp.value.trim();paint();}
  document.getElementById("kbgo").onclick=run;
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")run();});
  paint();
}

var econLoaded=false;
function b64ToUtf8(b64){
  var bin=atob(b64),bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}
function openEcon(){
  CUR="econ";paintNav();
  document.getElementById("crumb").innerHTML='平台 / <b>项目经济性分析</b>';
  var w=document.getElementById("econwrap");w.style.display="flex";
  if(!econLoaded){
    try{
      var src=document.getElementById("econSrc").textContent.trim();
      var html=b64ToUtf8(src);
      var fr=document.createElement("iframe");
      fr.setAttribute("title","固定资产项目经济性评价系统");
      fr.srcdoc=html;
      document.getElementById("econLoading").remove();
      w.appendChild(fr);
      econLoaded=true;
    }catch(e){
      document.getElementById("econLoading").innerHTML="经济性分析系统载入失败："+esc(e.message);
    }
  }
}
function closeEcon(){document.getElementById("econwrap").style.display="none";}
document.getElementById("econBack").onclick=function(){go("dash");};
